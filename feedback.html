<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexTrack — Live</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet" />

    <!-- External CSS -->
    <link rel="stylesheet" href="index.css" />

    <!-- External JS -->
    <script src="index.js" defer></script>
</head>

<body>

    <!-- status bar -->
    <div class="status-bar">
        <div class="status-pill" id="statusPill">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Offline</span>
        </div>
        <!-- Clean text readout without outline/button styling -->
        <div class="session-badge" id="sessionStatus">Session: Inactive</div>
    </div>

    <div class="page-title">Live Reading</div>

    <div class="content">

        <!-- bluetooth selector -->
        <div class="ble-row">
            <select class="ble-select" id="bleSelect">
                <option value="">Select knee brace device…</option>
                <option value="brace1">FlexTrack Brace — Left</option>
                <option value="brace2">FlexTrack Brace — Right</option>
            </select>
            <!-- bluetooth icon -->
            <div class="ble-icon-btn" id="bleIconBtn">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Changed stroke="#7d8590" to stroke="currentColor" -->
                    <path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
        </div>

        <!-- angle circle -->
        <div class="circle-wrap">
            <div class="circle-ring">
                <div class="circle-inner">
                    <!-- 1. Middle angle readout (Initialized to 0 for standby) -->
                    <div class="circle-angle">0</div>
                    <div class="circle-unit">DEGREES</div>

                    <!-- 2. Dynamic state label (Targeted via the inner <span>) -->
                    <div class="circle-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4" />
                        </svg>
                        <span>STANDBY</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- connect button -->
        <button class="btn-connect" id="btnConnect" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6.5 6.5l11 11M6.5 17.5l11-11M12 2v20"/>
            </svg>
            Connect Knee Brace
        </button>

        <!-- target range card -->
        <div class="target-card">

            <div class="target-card-header">
                <div class="target-label">Target Range</div>
                <div class="target-program">Program Day 12</div>
            </div>

            <!-- visual range track -->
            <div class="target-range-row">
                <div class="range-value">
                    <div class="range-number">80°</div>
                    <div class="range-sublabel">Min</div>
                </div>
                <div class="range-track-wrap">
                    <div class="range-track">
                        <div class="range-fill"></div>
                        <div class="range-marker"></div>
                    </div>
                    <div class="range-track-label">0° ——————————— 150°</div>
                </div>
                <div class="range-value">
                    <div class="range-number">110°</div>
                    <div class="range-sublabel">Max</div>
                </div>
            </div>

            <!-- numeric comparison chips -->
            <div class="comparison-row">
                <div class="comparison-chip">
                    <div class="chip-label">Current</div>
                    <div class="chip-value green">95°</div>
                </div>
                <div class="comparison-chip">
                    <div class="chip-label">Target mid</div>
                    <div class="chip-value">95°</div>
                </div>
                <div class="comparison-chip">
                    <div class="chip-label">Difference</div>
                    <div class="chip-value delta">+0°</div>
                </div>
            </div>

        </div>

    </div>

    <!-- bottom nav -->
    <nav class="nav">
        <a class="nav-item" href="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
          <span class="nav-label">Progress</span>
        </a>
        <!-- Active state moved to Live -->
        <a class="nav-item active" href="feedback.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span class="nav-label">Live</span>
        </a>
        <a class="nav-item" href="settings.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
          <span class="nav-label">Settings</span>
        </a>
      </nav>

</body>

</html>
